<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ModuVision</title>
    <link rel="stylesheet" href="../CSS/Dashboard.css">
</head>
<body>
    <!-- Navbar -->
    <div class="navbar">
        <div class="navbar-left"></div>

        <div class="navbar-center">
            <div class="navbar-title">ModuVision</div>
        </div>

        <div class="navbar-right">
            <div class="navbar-logo">
                <!-- ✅ Logo is now non-draggable -->
                <img src="../Media/logo_2_new-removebg-preview_new.png"
                     alt="ModuVision Logo"
                     title="Project Logo"
                     draggable="false">
            </div>
        </div>
    </div>

    <div class="container">
        <div class="sidebar">
            <h3>Functions</h3>

            <div class="functionality" draggable="true" data-type="Object Detection">
                👁️ Object Detection
            </div>

            <div class="functionality" draggable="true" data-type="Color Detection">
                🎨 Color Detection
            </div>

            <div class="functionality" draggable="true" data-type="Tracking">
                🎯 Tracking
            </div>
        </div>

        <div class="canvas-wrapper">
            <div class="canvas" id="canvas">
                <svg id="connectionSvg">
                    <defs>
                        <linearGradient id="lineGradient" x1="0%" y1="0%" x2="100%" y2="100%">
                            <stop offset="0%" style="stop-color:#6496ff; stop-opacity:1" />
                            <stop offset="100%" style="stop-color:#9334ea; stop-opacity:1" />
                        </linearGradient>
                    </defs>
                </svg>
            </div>
        </div>

        <div class="live-feed-panel">
            <div class="live-feed-title">
                <div style="display: flex; align-items: center; gap: 8px;">
                    <div class="live-feed-dot"></div>
                    Live Feed
                </div>

                <div class="live-feed-buttons">
                    <button class="live-feed-btn" onclick="saveProject()">💾 Save</button>
                    <button class="live-feed-btn">📤 Upload</button>
                </div>
            </div>

            <div class="live-feed-content">
                <span>Waiting for input...</span>
            </div>
        </div>
    </div>

    <script src="../JS/Dashboard.js"></script>
</body>
</html>
