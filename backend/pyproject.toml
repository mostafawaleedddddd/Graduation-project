[project]
name = "moduvision-backend"
version = "1.0.0"
description = "ModuVision FastAPI Backend for Vercel Python Services"
requires-python = ">=3.10"
dependencies = [
    "fastapi[standard]>=0.128.1",
    "uvicorn[standard]>=0.30.0",
    "opencv-python>=4.8.0",
    "ultralytics>=8.0.0",
    "numpy>=1.24.0",
    "scipy>=1.11.0",
    "pillow>=10.0.0",
    "torch>=2.0.0",
    "torchvision>=0.15.0",
    "scikit-learn>=1.3.0",
    "pandas>=2.0.0",
    "matplotlib>=3.7.0",
    "seaborn>=0.12.0",
    "python-dotenv>=1.0.0",
    "aiofiles>=23.0.0",
    "pydantic>=2.0.0",
    "requests>=2.31.0"
]

[tool.hatch.build.targets.wheel]
packages = ["main.py"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
