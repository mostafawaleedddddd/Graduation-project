[project]
name = "moduvision-backend"
version = "1.0.0"
description = "ModuVision FastAPI Backend for Vercel Python Services"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.128.1",
    "uvicorn>=0.30.0",
    "numpy>=1.24.0",
    "pillow>=10.0.0",
    "python-dotenv>=1.0.0",
    "aiofiles>=23.0.0",
    "pydantic>=2.0.0",
    "requests>=2.31.0"
]

[tool.hatch.build.targets.wheel]
packages = ["main.py"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
